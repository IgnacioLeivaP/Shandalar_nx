; ShandalarPad: controla el mouse y el teclado con el mando.
; Este archivo va junto a Shandalar.exe. Si falta, se usan estos mismos valores.
;
; Mientras ShandalarPad está activo, el mando es suyo. Autorun deja de mover
; el cursor por su cuenta, pero la pantalla táctil sigue funcionando como
; mouse (tocar = clic izquierdo).
;
; Mantén L3 + R3 (clic de ambos sticks) durante un segundo para suspenderlo
; y volver a los controles de Autorun (Shandalar.keys.txt). Repite la misma
; combinación para reactivarlo.

[ShandalarPad]
; 1 = activo, 0 = todo ShandalarPad desactivado (mando y ajuste de ventana)
Enabled=1

; Escribe ShandalarPad.log junto al juego (útil para reportar problemas)
Log=1

; Velocidad del cursor en píxeles por segundo con el stick a fondo
CursorSpeed=900

; Porcentaje de velocidad mientras se mantiene "precision" (ZL) o "turbo" (ZR)
PrecisionPercent=30
TurboPercent=220

; Zona muerta de los sticks, en porcentaje del recorrido
DeadzonePercent=18

; Curva de respuesta (exponente x100): 100 = lineal, 200 = más fino al centro
CurvePercent=200

; Cada stick puede ser: mouse, arrows (flechas del teclado) u off
LeftStick=mouse
RightStick=mouse

; Milisegundos que hay que mantener L3 + R3 para suspender o reactivar
SuspendHoldMs=1000

; Teclas que Autorun envía con L3 y R3 mientras ShandalarPad está suspendido.
; Sirven para detectar la combinación de reactivación. Deben coincidir con
; STICKL y STICKR de Shandalar.keys.txt (0x11 = Ctrl, 0x12 = Alt).
ResumeKey1=0x11
ResumeKey2=0x12

; Intervalo de lectura del mando, en milisegundos
PollMs=8

[Buttons]
; Los nombres son los de los botones de la Switch.
; Acciones posibles:
;   lclick / rclick / mclick   botón del mouse (se mantiene mientras se mantenga el botón)
;   ldouble / rdouble          doble clic izquierdo / derecho
;   wheelup / wheeldown        rueda del mouse (se repite al mantener)
;   precision / turbo          cursor lento / rápido mientras se mantiene
;   none                       nada
;   códigos de tecla virtual de Windows, por ejemplo 0x0D (Enter), o
;   combinaciones como 0x11+0x53 (Ctrl+S, guardar partida en duelo)
;
; En Shandalar, el doble clic izquierdo hace auto-tap de maná y ordena las
; cartas, y el doble clic derecho muestra la carta completa.
A=lclick
B=rclick
X=rdouble
Y=ldouble
L=0x0D
R=0x20
ZL=precision
ZR=turbo
Plus=0x1B
; Minus queda libre: Autorun usa Minus + stick derecho para su teclado en
; pantalla, y mantener + y - durante un segundo cierra el juego.
Minus=none
LStick=none
RStick=none
Up=0x26
Down=0x28
Left=0x25
Right=0x27

[Window]
; Ajustes de la ventana del modo aventura cuando Shandalar.ini tiene
; Window = 1 o 2 (recomendado en Switch: Window = 2).
;
; 1 = la ventana de 1024x768 se crea sin barra de título ni bordes y arriba
; del todo. En la pantalla de 1280x720 de Autorun solo quedan fuera las
; últimas 48 líneas (la franja decorativa inferior del mapa).
FixMainWindow=1

; 1 = centrar la ventana horizontalmente (franjas negras a ambos lados)
Center=0

; Desplazamiento vertical. Con -48 se recorta la parte de arriba en vez de
; la de abajo.
OffsetY=0

; Experimental: le dice al juego que la pantalla mide 1024x768 y que el
; cambio de resolución funcionó. Permite usar Window = 0 sin que el juego se
; caiga en 1280x720. Pruébalo si los duelos no se ven bien con Window = 2.
FakeScreen=0
